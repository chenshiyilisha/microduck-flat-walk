# Deploy-gate CI (Pass13, 2026-11-08).
#
# Mirrors the industry pattern where a policy-deploy validation step is wired into
# CI (e.g. reflex-vla's `reflex validate export --init-ci` scaffolds a GitHub
# Actions workflow). Our four-dimension deploy gate must not be allowed to silently
# bitrot between commits: this workflow re-runs it on every push/PR.
#
# What it runs (all CPU-only, no GPU, no robot):
#   1. conductor --selftest     proves the guard wiring is intact (no real policy)
#   2. inference --selftest      proves the output negative-control logic (stdlib-only)
#   3. record_provenance --print shows the training provenance of the committed policy
#   4. the REAL gate on each committed deploy onnx + robotd.toml (contract/bundle/
#      numeric/inference/toml)  -- this is the actual "safe to load?" verdict
#
# The inference stage SKIPs (not fails) if onnxruntime is unavailable, so a partial
# install still yields a meaningful verdict.
name: deploy-gate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  deploy-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microduck-software
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deploy-verification toolchain
        run: python -m pip install --upgrade pip && pip install -r tools/hd1910/requirements.txt

      - name: Conductor self-test (guard wiring)
        run: python tools/hd1910/pre_deploy_check.py --selftest

      - name: Inference negative-control self-test (stdlib-only)
        run: python tools/hd1910/verify_policy_inference.py --selftest

      - name: Show training provenance of committed policy
        run: python tools/hd1910/record_provenance.py --bundle out/hd1910_kp8_deploy_bundle.json --print

      - name: Verify provenance matches committed onnx (drift detection)
        run: python tools/hd1910/record_provenance.py --bundle out/hd1910_kp8_deploy_bundle.json --verify

      - name: Real deploy gate on committed artifacts
        # NOTE: the "contract" stage (obs 61 / joint-order / home-pose / action
        # mapping vs robotd's own source) is SKIPPED here because it needs the
        # full training stack (mjlab_microduck + torch + mujoco), which is NOT in
        # tools/hd1910/requirements.txt. The conductor prints a "PASS*" verdict
        # naming the skipped stages, so a green CI run is NOT a full verification.
        # Before shipping, run pre_deploy_check.py locally with the training env
        # + onnxruntime installed so the contract stage actually executes.
        run: |
          set -e
          WALK="logs/rsl_rl/microduck_velocity_hd1910/2026-11-07_22-12-33_p8head_030_4096x3000_resume2999/2026-11-07_22-12-33_p8head_030_4096x3000_resume2999.onnx"
          GP="logs/rsl_rl/microduck_groundpick_hd1910/2026-11-06_22-17-10_hd1910_groundpick_4096x4000_1106_2216/2026-11-06_22-17-10_hd1910_groundpick_4096x4000_1106_2216.onnx"
          SU="logs/rsl_rl/microduck_standup_hd1910/2026-11-08_03-08-50_p8_standup_4096x4000_1108_0308/2026-11-08_03-08-50_p8_standup_4096x4000_1108_0308.onnx"
          TOML="out/robotd_hd1910_mode0.toml"
          for O in "$WALK" "$GP" "$SU"; do
            echo "=== gate: $O ==="
            python tools/hd1910/pre_deploy_check.py --onnx "$O" --toml "$TOML" --expect-kp 16 --json "out/ci_$(basename "$O" .onnx).json"
          done
