# Deploy-gate CI (Pass13, extended Pass18 2026-11-08).
#
# Mirrors the industry pattern where a policy-deploy validation step is wired into
# CI (e.g. reflex-vla's `reflex validate export --init-ci` scaffolds a GitHub
# Actions workflow). Our deploy gate must not be allowed to silently bitrot
# between commits: this workflow re-runs it on every push/PR.
#
# PASS18 -- the real gate inputs ARE NOW COMMITTED (git add -f, same mechanism
# already used for artifacts/flat_walk/*.onnx):
#   * 3 deployed .onnx (2.27 MiB) whose sha256/bytes are recorded in
#     out/hd1910_kp8_deploy_bundle.json
#   * the 9 read-only robotd/RL contract sources the guards actually parse
#   * out/runmeta_*.json + out/heading_meta_*.json companions
# Pass13-17 had edited this workflow without ever checking it against a clean
# checkout: those files were gitignored, so `record_provenance --verify` returned
# rc=1, `conductor --selftest` rc=1 and the "real gate" step got four FAILs.
# assert_clean_checkout.py --strict now makes that precondition a hard gate.
#
# What runs here (all CPU-only, no GPU, no robot):
#   1. readiness probe --strict   -> every committed gate input present/tracked
#   2. assertion + guard selftests (contract.selftest is an EXPLICIT allow-listed
#      SKIP because the training stack is not installed here)
#   3. pytest tests/               -> the tooling/config regression suite
#   4. real gate on each committed deploy onnx: bundle / numeric / inference /
#      toml REALLY execute; `contract` is an explicit SKIP asserted by
#      assert_ci_verdict.py --allow-skip contract
#
# HONEST BOUNDARY: `contract` compares the ONNX obs layout / joint order / home
# pose against the LIVE training cfg and needs mjlab_microduck (torch + mujoco).
# That stack is not in tools/hd1910/requirements.txt. CI therefore verifies 4/5
# stages, and the conductor prints a PASS* verdict naming the skipped stage.
# Before shipping, run `pre_deploy_check.py --onnx ... --toml ...` AND
# `pytest tests/` locally with .venv-mjlab so all 5 stages execute.
# A green CI here is NOT a deployment sign-off.

name: deploy-gate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  deploy-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microduck-software
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deploy-verification toolchain
        run: python -m pip install --upgrade pip && pip install -r tools/hd1910/requirements.txt

      - name: "CI input readiness probe (strict - real gate inputs must be committed)"
        id: readiness
        run: |
          python tools/hd1910/assert_clean_checkout.py \
            --strict \
            --json out/ci_readiness.json \
            --github-output "$GITHUB_OUTPUT"
          cat out/ci_readiness.json

      - name: Probe negative-control self-test
        run: python tools/hd1910/assert_clean_checkout.py --selftest

      - name: CI verdict assertion negative-control self-test
        run: python tools/hd1910/assert_ci_verdict.py --selftest

      - name: Conductor self-test (guard wiring; contract.selftest explicitly skipped)
        run: |
          python tools/hd1910/pre_deploy_check.py --selftest \
            --selftest-allow-skip contract.selftest

      - name: Inference negative-control self-test (stdlib-only)
        run: python tools/hd1910/verify_policy_inference.py --selftest

      - name: Regression suite (tooling + config invariants)
        run: python -m pytest tests/ -q -rs

      - name: Show training provenance of committed policy
        run: python tools/hd1910/record_provenance.py --bundle out/hd1910_kp8_deploy_bundle.json --print

      - name: Verify provenance + bundle artifact hashes (drift detection)
        run: python tools/hd1910/record_provenance.py --bundle out/hd1910_kp8_deploy_bundle.json --verify

      - name: Real deploy gate on committed artifacts
        # onnxruntime IS installed above, so inference must actually EXECUTE.
        # Only `contract` may SKIP (needs mjlab_microduck); assert_ci_verdict.py
        # rejects any other SKIP/FAIL, so a broken guard cannot look green.
        run: |
          set -e
          WALK="logs/rsl_rl/microduck_velocity_hd1910/2026-11-07_22-12-33_p8head_030_4096x3000_resume2999/2026-11-07_22-12-33_p8head_030_4096x3000_resume2999.onnx"
          GP="logs/rsl_rl/microduck_groundpick_hd1910/2026-11-06_22-17-10_hd1910_groundpick_4096x4000_1106_2216/2026-11-06_22-17-10_hd1910_groundpick_4096x4000_1106_2216.onnx"
          SU="logs/rsl_rl/microduck_standup_hd1910/2026-11-08_03-08-50_p8_standup_4096x4000_1108_0308/2026-11-08_03-08-50_p8_standup_4096x4000_1108_0308.onnx"
          TOML="out/robotd_hd1910_mode0.toml"
          for O in "$WALK" "$GP" "$SU"; do
            echo "=== gate: $O ==="
            REPORT="out/ci_$(basename "$O" .onnx).json"
            python tools/hd1910/pre_deploy_check.py --onnx "$O" --toml "$TOML" --expect-kp 16 --json "$REPORT"
            python tools/hd1910/assert_ci_verdict.py "$REPORT" --allow-skip contract
          done

      - name: Print the verification boundary (do not read green CI as full sign-off)
        run: |
          echo "scope_gate=${{ steps.readiness.outputs.scope_gate }}"
          echo "full_gate=${{ steps.readiness.outputs.full_gate }}"
          echo "CONTRACT STAGE NOT VERIFIED IN CI -- run pre_deploy_check.py and pytest tests/ with .venv-mjlab before shipping."
