# Deploy-gate CI (Pass13, extended Pass18/Pass19 2026-11-08).
#
# PASS19 -- THIS FILE MUST LIVE AT THE REPOSITORY ROOT.
# GitHub only discovers workflows stored in <repo-root>/.github/workflows
# (docs.github.com quickstart: "For GitHub to discover any GitHub Actions
# workflows in your repository, you must save the workflow files in a directory
# called .github/workflows"). Pass13-18 kept this file at
# microduck-software/.github/workflows/ and never pushed it: the remote
# Actions API returned total_count=0 (zero discovered workflows) and
# GET /contents/.github/workflows returned 404. Four rounds of "green CI" were
# green ONLY inside a local full workspace -- GitHub had never registered this
# workflow at all. assert_clean_checkout.py --strict now checks placement;
# a local pytest test pins it (CI cannot self-guard its own existence: if the
# file is in the wrong place, CI never runs to complain).
#
# Mirrors the industry pattern where a policy-deploy validation step is wired into
# CI (e.g. reflex-vla's `reflex validate export --init-ci` scaffolds a GitHub
# Actions workflow). Our deploy gate must not be allowed to silently bitrot
# between commits: this workflow re-runs it on every push/PR.
#
# PASS18 -- the real gate inputs ARE NOW COMMITTED (git add -f, same mechanism
# already used for artifacts/flat_walk/*.onnx):
#   * 3 deployed .onnx (2.27 MiB) whose sha256/bytes are recorded in
#     out/hd1910_kp8_deploy_bundle.json
#   * the 9 read-only robotd/RL contract sources the guards actually parse
#   * out/runmeta_*.json + out/heading_meta_*.json companions
# Pass13-17 had edited this workflow without ever checking it against a clean
# checkout: those files were gitignored, so `record_provenance --verify` returned
# rc=1, `conductor --selftest` rc=1 and the "real gate" step got four FAILs.
# assert_clean_checkout.py --strict now makes that precondition a hard gate.
#
# What runs here (all CPU-only, no GPU, no robot):
#   1. readiness probe --strict   -> every committed gate input present/tracked
#   2. assertion + guard selftests (contract.selftest is an EXPLICIT allow-listed
#      SKIP because the training stack is not installed here)
#   3. pytest tests/               -> the tooling/config regression suite
#   4. real gate on each committed deploy onnx: bundle / numeric / inference /
#      toml REALLY execute; `contract` is an explicit SKIP asserted by
#      assert_ci_verdict.py --allow-skip contract. PASS20: the three onnx paths,
#      the toml and --expect-kp are READ FROM THE BUNDLE by ci_gate_targets.py,
#      not hard-coded here (a third copy of the list rotted silently).
#
# PASS20 GOVERNANCE BOUNDARY (verified against GitHub docs, not assumed):
# this is a POST-PUSH ADVISORY CHECK, not a merge gate. `main` has no branch
# protection and no rulesets; this repo has 0 PRs and every one of the first
# four runs was a `push` event, so a red run never stopped a commit landing on
# main (two failing runs are ancestors of main). Adding a "required status
# check" would be decorative here: docs say required checks apply "before
# merging" (PRs), admins are exempt by default, and "A job that is skipped
# will report its status as 'Success'. It will not prevent a pull request
# from merging, even if it is a required check." The REAL gate is the LOCAL
# pre-push workflow: `assert_clean_checkout.py --strict` + pytest + the five
# stages with .venv-mjlab. Do not read a green run as a merge gate.
#
# HONEST BOUNDARY: `contract` compares the ONNX obs layout / joint order / home
# pose against the LIVE training cfg and needs mjlab_microduck (torch + mujoco).
# That stack is not in tools/hd1910/requirements.txt. CI therefore verifies 4/5
# stages, and the conductor prints a PASS* verdict naming the skipped stage.
# Before shipping, run `pre_deploy_check.py --onnx ... --toml ...` AND
# `pytest tests/` locally with .venv-mjlab so all 5 stages execute.
# A green CI here is NOT a deployment sign-off.

name: deploy-gate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  deploy-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microduck-software
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deploy-verification toolchain
        run: python -m pip install --upgrade pip && pip install -r tools/hd1910/requirements.txt

      - name: "CI input readiness probe (strict - real gate inputs must be committed)"
        id: readiness
        run: |
          python tools/hd1910/assert_clean_checkout.py \
            --strict \
            --json out/ci_readiness.json \
            --github-output "$GITHUB_OUTPUT"
          cat out/ci_readiness.json

      - name: Probe negative-control self-test
        run: python tools/hd1910/assert_clean_checkout.py --selftest

      - name: CI gate targets negative-control self-test (bundle-driven)
        run: python tools/hd1910/ci_gate_targets.py --selftest

      - name: Bundle bindings negative-control self-test (SLSA subject binding)
        # Pass21/R5 + Pass22/R6: EVERY tamper case must go red. R6 additionally
        # re-derives each archived report's verdict from its own stages and
        # binds the stage set to the CURRENT pre_deploy_check.py FULL_STAGES,
        # so a report predating a newly added stage cannot pass as evidence.
        # Do NOT pin a case count here: it silently rotted 14 -> 15 -> 22.
        run: python tools/hd1910/bundle_bindings.py --selftest

      - name: CI verdict assertion negative-control self-test
        # Pass23/R7: the LIVE report assertion now shares deploy_stages.py with
        # the archived-evidence guard. It re-derives the verdict from the stages
        # and binds the stage set to the conductor's FULL_STAGES, so a trimmed,
        # duplicated or forged live report must go red here instead of passing
        # as a green aggregate.
        run: python tools/hd1910/assert_ci_verdict.py --selftest

      - name: Conductor self-test (guard wiring; contract.selftest explicitly skipped)
        run: |
          python tools/hd1910/pre_deploy_check.py --selftest \
            --selftest-allow-skip contract.selftest

      - name: Inference negative-control self-test (stdlib-only)
        run: python tools/hd1910/verify_policy_inference.py --selftest

      - name: Regression suite (tooling + config invariants)
        run: python -m pytest tests/ -q -rs

      - name: Show training provenance of committed policy
        run: python tools/hd1910/record_provenance.py --bundle out/hd1910_kp8_deploy_bundle.json --print

      - name: Verify bundle internal bindings (SLSA subject + re-derived claims)
        run: python tools/hd1910/bundle_bindings.py --bundle out/hd1910_kp8_deploy_bundle.json --json

      - name: Verify provenance + bundle artifact hashes (drift detection)
        # Also runs verify_bindings() internally -- two independent call sites
        # so deleting either guard cannot silently restore the C1/C3/C4/C7
        # blind spot. Do not remove this step: it is a real gate, not a print.
        run: python tools/hd1910/record_provenance.py --bundle out/hd1910_kp8_deploy_bundle.json --verify

      - name: Real deploy gate on committed artifacts
        # PASS20 / R4: targets come from the BUNDLE, not a hard-coded third copy.
        # The old shell literals went stale in silence: pointing ground_pick at a
        # non-existent onnx left `--strict`, pytest and provenance --verify all
        # green, so CI would validate a policy the bundle does not ship. Now
        # ci_gate_targets.py reads out/hd1910_kp8_deploy_bundle.json (the single
        # source of truth) and emits GATE_* vars; a local guard in
        # assert_clean_checkout.py fails if .onnx paths are hard-coded again.
        # onnxruntime IS installed above, so inference must actually EXECUTE.
        # Only `contract` may SKIP (needs mjlab_microduck). Pass23/R7:
        # assert_ci_verdict.py re-derives the verdict from the stages and binds
        # the stage set to FULL_STAGES via the shared deploy_stages.py -- a
        # trimmed, duplicated or forged live report cannot look green. The
        # SAME authority guards the archived bundle reports.
        run: |
          set -e
          BUNDLE="out/hd1910_kp8_deploy_bundle.json"
          TARGETS_SH="${RUNNER_TEMP:-/tmp}/gate_targets.sh"
          python tools/hd1910/ci_gate_targets.py --bundle "$BUNDLE" --sh > "$TARGETS_SH"
          . "$TARGETS_SH"
          test "$GATE_COUNT" -eq 3
          for O in "$GATE_WALK" "$GATE_GROUND_PICK" "$GATE_STAND"; do
            echo "=== gate: $O ==="
            REPORT="out/ci_$(basename "$O" .onnx).json"
            python tools/hd1910/pre_deploy_check.py --onnx "$O" --toml "$GATE_TOML" --expect-kp "$GATE_EXPECT_KP" --json "$REPORT"
            python tools/hd1910/assert_ci_verdict.py "$REPORT" --allow-skip contract
          done

      - name: Print the verification boundary (do not read green CI as full sign-off)
        run: |
          echo "scope_gate=${{ steps.readiness.outputs.scope_gate }}"
          echo "full_gate=${{ steps.readiness.outputs.full_gate }}"
          echo "workflow_discoverable=${{ steps.readiness.outputs.workflow_discoverable }}"
          echo "CI IS A POST-PUSH ADVISORY CHECK, NOT A MERGE GATE -- main is unprotected (no branch protection / no rulesets); a red run does not stop a commit."
          echo "CONTRACT STAGE NOT VERIFIED IN CI -- run pre_deploy_check.py and pytest tests/ with .venv-mjlab before shipping."
